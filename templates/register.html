{% extends "base.html" %}

{% block title %}Register | HelpDesk{% endblock %}

{% block content %}

<div class="form-card">
    <h2>Create Your Account</h2>

    <form method="POST" action="{{ url_for('register') }}">

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            autocomplete="name"
            required
        >

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button type="submit" class="button">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>

{% endblock %}
